<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fast Scan Control</title><style>:root{color-scheme:dark}body{font:16px system-ui;background:#131c32;color:#e8edf8;max-width:620px;margin:7vh auto;padding:24px}.panel{padding:24px;background:#202b49;border:1px solid #3a4768;border-radius:14px}button,input{padding:12px;border:1px solid #5b7093;border-radius:9px;color:white;background:#2c4063}input{box-sizing:border-box;width:100%}button{cursor:pointer;margin:12px 5px 5px 0}button.primary{background:#416998}button:disabled{opacity:.5}#status{white-space:pre-wrap;line-height:1.6}</style><h1>⚡ Fast Scan Control</h1><div class="panel"><p>Direct connection to your local Chrome extension. No Cloudflare Worker and no new tab.</p><label>Extension ID<input id="extensionId" placeholder="Paste the ID from Fast Scan Setup" autocomplete="off"></label><button id="save">Save ID</button><button id="ping">Test connection</button><button id="scan" class="primary">Scan Now</button><p id="status">Connect your extension to begin.</p></div><p>This page can trigger a scan only after you approve this GitHub Pages origin in the extension.</p><script src="web-control.js"></script></html>
