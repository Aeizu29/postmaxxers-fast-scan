<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Postmaxxers — Fast Scan</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#131c32;color:#e8edf8;margin:0;padding:55px 20px}.main{max-width:540px;margin:auto}.panel{padding:28px;background:#202b49;border:1px solid #3a4768;border-radius:16px}h1{margin:0 0 20px}p{line-height:1.6;color:#b9c7dd}button{font:700 18px system-ui;cursor:pointer;padding:16px 28px;color:#101928;background:#f0cb53;border:0;border-radius:10px;width:100%}button:hover{filter:brightness(1.08)}button:disabled{opacity:.65;cursor:wait}#status{white-space:pre-wrap;margin-top:22px}small{color:#90a2c0}
</style></head><body><main class="main"><h1>⚡ Fast Scan</h1><section class="panel"><button id="scan">Scan Now</button><p id="status" role="status">Connecting to Chrome extension…</p><small>No Cloudflare Worker. No tab opened for the scan. Requires the companion extension in the same Chrome browser.</small></section></main><script>
(()=>{'use strict';
const status=document.getElementById('status'),button=document.getElementById('scan');
const channel='postmaxxers-fast-scan-v2';const pending=new Map();let bridgeSeen=false;
function request(type,timeout=2200){return new Promise((resolve,reject)=>{const id='req-'+Date.now()+'-'+Math.random().toString(36).slice(2);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('No response from extension bridge'));},timeout);pending.set(id,m=>{clearTimeout(timer);resolve(m)});window.postMessage({channel,from:'page',type,id},location.origin);});}
window.addEventListener('message',e=>{if(e.source!==window||e.origin!==location.origin)return;const m=e.data;if(!m||m.channel!==channel||m.from!=='extension')return;bridgeSeen=true;if(m.type==='BRIDGE_READY')status.textContent='Extension bridge loaded. Checking connection…';if(m.type==='RESPONSE'&&pending.has(m.id)){const done=pending.get(m.id);pending.delete(m.id);done(m);}});
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Scanning in the background…';try{const m=await request('SCAN',120000);if(!m.ok)throw Error(m.error||m.reason||'Scan failed');status.textContent='Scan complete: '+(m.count||0)+' users. Check GitHub publishing status in the extension.';}catch(e){status.textContent='Scan failed: '+e.message;}finally{button.disabled=false;}});
async function connect(){status.textContent='Connecting to Chrome extension (checking bridge)…';for(let i=0;i<5;i++){try{const m=await request('PING',2000);if(m.ok){status.textContent='Extension detected. Ready to scan.';return;}status.textContent='Extension detected but connection refused: '+(m.error||'Unknown error');return;}catch(e){if(i<4)await new Promise(r=>setTimeout(r,500));}}
status.textContent=bridgeSeen?'Bridge script detected, but did not reply. Check the extension Errors page in chrome://extensions.':'No extension bridge detected on this page. Check that the new Fast Scan extension is enabled and approved for https://aeizu29.github.io, then reload the extension and page.';}
connect().catch(e=>{status.textContent='Connection script error: '+e.message;});
})();
</script></body></html>
